<script>/*JARVIS_CONFIG*/

  modelos: [{ nome: 'Sonnet', id: 'sonnet', nota: 'equilíbrio' }], padrao: 'Sonnet',

<script>
(() => {
  const W = 1344, H = 768;
  const C = { x: 652, y: 336 };          // núcleo dourado
  const RING = { rx: 296, ry: 272 };     // anel externo, onde ficam os centralizadores
  const RMAX = 262;                      // raio máximo do cluster
  const F = 1150;                        // distância focal da perspectiva

  const palco = document.getElementById('palco');
  const cv = document.getElementById('ceu');
  const ctx = cv.getContext('2d');
  // o céu é desenhado na resolução real da tela (pixels do monitor × escala do palco), senão a
  // ampliação do palco borra as estrelas
  let DPR = 1;

  let escala = 1;
  function caber() {
    escala = Math.min(innerWidth / W, innerHeight / H);
    palco.style.transform = `translate(${-W * escala / 2}px, ${-H * escala / 2}px) scale(${escala})`;
    const R = Math.max(1, Math.min(3, (window.devicePixelRatio || 1) * escala));
    if (Math.abs(R - DPR) > 0.01 || cv.width !== Math.round(W * R)) { DPR = R; cv.width = Math.round(W * R); cv.height = Math.round(H * R); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  }
  addEventListener('resize', caber); caber();
  // coordenadas do palco a partir do mouse
  const noPalco = e => { const r = palco.getBoundingClientRect(); return { x: (e.clientX - r.left) / escala, y: (e.clientY - r.top) / escala }; };

  // ---------- ajustes ----------
  const aj = {};
  for (const id of ['n', 'vel', 'var', 'nev', 'vl', 'par', 'cin', 'fs']) {
    const el = document.getElementById(id), out = document.getElementById('o-' + id);
    const ler = () => { aj[id] = +el.value; out.textContent = ['nev', 'var', 'vl', 'cin', 'fs'].includes(id) ? Math.round(el.value * 100) + '%' : el.value + (id === 'vel' ? '×' : id === 'par' ? ' px' : ''); };
    el.addEventListener('input', () => { ler(); if (id === 'n') semear(); if (id === 'fs') document.documentElement.style.setProperty('--fs', el.value); });
    ler();
  }
  const demoEl = document.getElementById('demo');
  const meteorosEl = document.getElementById('meteoros');
  const autogiroEl = document.getElementById('autogiro');
  const painel = document.getElementById('ajustes');
  document.getElementById('engrenagem').onclick = () => painel.classList.toggle('aberto');
  addEventListener('keydown', e => { if (e.key === 'a' || e.key === 'A') painel.classList.toggle('aberto'); });

  // ---------- sprites de brilho ----------
  function sprite(cor) {
    const s = document.createElement('canvas'); s.width = s.height = 64;
    const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    // núcleo firme e um halo que cai mais rápido: a estrela fica nítida, ainda com um brilho em volta
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.09, 'rgba(255,255,255,.97)'); gr.addColorStop(0.14, cor(0.85)); gr.addColorStop(0.22, cor(0.22));
    gr.addColorStop(0.36, cor(0.05)); gr.addColorStop(0.6, cor(0.01)); gr.addColorStop(1, cor(0));
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
  }
  const SP = {
    ouro: sprite(a => `rgba(246,182,72,${a})`),
    branco: sprite(a => `rgba(235,232,222,${a})`),
    azul: sprite(a => `rgba(160,198,245,${a})`),
    ciano: sprite(a => `rgba(150,224,240,${a})`),
    anil: sprite(a => `rgba(110,150,236,${a})`),
  };
  const COR_PONTO = { ouro: '#f3b85a', azul: '#a9c8f2', branco: '#ece7da', ciano: '#9fe2ef', anil: '#86a3ee' };

  const rnd = (a, b) => a + Math.random() * (b - a);
  const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += Math.random(); return (u - 2) / 1.15; };
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // ---------- câmera: modo Disco (de frente, achatado) ou Espacial (com volume, gira no arrasto) ----------
  const cam = { modo: 'disco', esp: 0, pitch: 0, yaw: 0, alvoPitch: 0, alvoYaw: 0, vPitch: 0, vYaw: 0, zoom: 1, alvoZoom: 1, px: 0, py: 0, alvoPx: 0, alvoPy: 0 };
  let cp, sp, cy_, sy_;       // senos e cossenos do quadro
  // disco: (x, y) no plano, h na normal. Rotação: pitch em torno do eixo horizontal, depois yaw em torno do vertical.
  function proj(x, y, h, par) {
    const y1 = y * cp - h * sp, h1 = y * sp + h * cp;
    const x2 = x * cy_ + h1 * sy_, h2 = -x * sy_ + h1 * cy_;
    const k = F / (F - h2 * cam.zoom) * cam.zoom;
    return { X: C.x + cam.px + x2 * k - pmx * par, Y: C.y + cam.py + y1 * k - pmy * par, k, d: h2 };
  }

  // ---------- grupos de dados: cada centralizador tem as suas estrelas ----------
  // as estrelas de conhecimento vêm do indexador (/api/estrelas); cada centralizador junta um tipo
  // nichos (com 'nicho'): separam um tipo de arquivo por padrão no nome ou na pasta e saem do grupo geral
  // o menu inferior vem do setup (jarvis.config.json → nichos). Cada botão junta um tipo ("nota", "skill",
  // "conversa", "artefato" ou "*") e, se tiver "padrao", só o que casar com ele (um nicho). "app" liga um atalho.
  const GRUPOS = JARVIS.nichos.map(n => ({ id: n.id, nome: n.nome + (n.app ? ' ↗' : ''), tipo: n.tipo || '*', app: n.app,
    nicho: n.padrao ? new RegExp(n.padrao, 'i') : null, itens: [] }));
  // grupos criados pelo "+": juntam as estrelas cujo nome ou caminho tem uma palavra
  const GRUPOS_EU = (() => { try { return JSON.parse(localStorage.getItem('jarvis.grupos') || '[]'); } catch { return []; } })();
  for (const g of GRUPOS_EU) GRUPOS.push({ ...g, itens: [] });
  // espaço entre centralizadores no arco (rad): aperta quando há muitos, para não passar das laterais
  const espHub = n => Math.min(0.385, 2.7 / Math.max(1, n - 1));

  function cartaoAutorizacao(ev) {
    const el = document.createElement('div'); el.className = 'msg autoriza';
    el.innerHTML = '<span><b></b><i class="onde"></i></span><div class="det"></div><div class="bts"><button class="sim">Autorizar</button><button class="nao">Recusar</button></div><small></small>';
    el.querySelector('b').textContent = 'O JARVIS quer: ' + ev.titulo;
    el.querySelector('.onde').textContent = ev.onde || '';
    const det = el.querySelector('.det');
    const bloco = (txt, cls) => { if (!txt) return; const pre = document.createElement('pre'); pre.className = cls; pre.textContent = txt; det.appendChild(pre); };
    bloco(ev.detalhe, ''); bloco(ev.antes, 'antes'); bloco(ev.depois, 'depois');
    el.lastChild.textContent = hora();
    const decidir = async permitir => {
      el.classList.add('respondida');
      const r = await postar('/api/autorizacao', { id: ev.id, permitir });
      const ok = r.ok; el.querySelector('.onde').textContent = (ev.onde ? ev.onde + ' · ' : '') + (!ok ? 'expirou' : permitir ? 'autorizado' : 'recusado');
    };
    el.querySelector('.sim').onclick = () => decidir(true); el.querySelector('.nao').onclick = () => decidir(false);
    const ultimo = msgs.querySelector('.msg.digitando'); msgs.insertBefore(el, ultimo || null); msgs.scrollTop = msgs.scrollHeight;
    if (chatCard.classList.contains('recolhido')) recolher('chat');
    fala.pulso = 1.4;
  }
  async function enviar(t) {
    tocadosNaResposta = new Set(); ultimoPonto = null;
    conv.ocupado = true; balao(t, true);
    const el = balao('', false), span = el.firstChild, acao = el.querySelector('.acao');
    el.classList.add('digitando'); fala.alvo = 1;
    let bruto = '';
    conv.ctrl = new AbortController();
    try {
      const r = await fetch('/api/chat', { method: 'POST', signal: conv.ctrl.signal, headers: { 'Content-Type': 'application/json', 'X-Jarvis': '1' },
        body: JSON.stringify({ texto: t, modelo: document.getElementById('modelo-nome').textContent, sessao: conv.sessao, conversa: conv.id, referencia: conv.ref, outra: conv.outra }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || 'o servidor recusou o pedido');
      const leitor = r.body.getReader(), dec = new TextDecoder(); let resto = '';
      for (;;) {
        const { value, done } = await leitor.read(); if (done) break;
        resto += dec.decode(value, { stream: true });
        const partes = resto.split('\n\n'); resto = partes.pop();
        for (const p of partes) {
          if (!p.startsWith('data: ')) continue;
          const ev = JSON.parse(p.slice(6));
          if (ev.tipo === 'sessao' && ev.id) { conv.sessao = ev.id; conv.ref = null; }
          else if (ev.tipo === 'texto') { bruto += ev.t; span.innerHTML = md(bruto); acao.textContent = ''; fala.pulso = Math.min(1.4, fala.pulso + 0.18 + ev.t.length / 60); }
          else if (ev.tipo === 'ferramenta') { acao.textContent = `${nomeAcao(ev.nome)}${ev.alvo ? ' ' + ev.alvo : ''}…`; fala.pulso = Math.min(1.4, fala.pulso + 0.3); }
          else if (ev.tipo === 'tocou') { tocar(ev); }
          else if (ev.tipo === 'autorizacao') { cartaoAutorizacao(ev); }
          else if (ev.tipo === 'erro') { el.classList.add('erro'); bruto += (bruto ? '\n\n' : '') + ev.msg; span.innerHTML = md(bruto); }
          else if (ev.tipo === 'fim') {
            if (ev.sessao) conv.sessao = ev.sessao;
            const n = tocadosNaResposta.size;
            acao.textContent = ev.negadas && ev.negadas.length ? `sem permissão para: ${[...new Set(ev.negadas)].join(', ')}` : n ? `consultou ${n} ${n === 1 ? 'estrela' : 'estrelas'} do cluster` : '';
          }
          msgs.scrollTop = msgs.scrollHeight;
        }
      }
      if (!bruto) { span.textContent = '(sem resposta)'; }
    } catch (err) {
      if (err.name !== 'AbortError') { el.classList.add('erro'); span.textContent = `Não consegui falar com o motor: ${err.message}. O servidor está ligado? (Abrir Jarvis.command)`; }
    } finally {
      el.classList.remove('digitando'); fala.alvo = 0; conv.ocupado = false; conv.ctrl = null;
    }
  }
  // ditado: o reconhecimento de fala do próprio navegador (no Chrome o áudio vai para o Google; no Safari, para a Apple).
  // Clique para começar, fale, clique de novo para parar; o texto entra no campo para você revisar e enviar.
  (() => {
    const RS = window.SpeechRecognition || window.webkitSpeechRecognition, bt = document.getElementById('mic');
    if (!RS) { bt.hidden = true; return; }
    let rec = null, base = '';
    bt.addEventListener('click', () => {
      if (rec) { rec.stop(); return; }
      rec = new RS(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
      base = texto.value ? texto.value.replace(/\s*$/, ' ') : '';
      rec.onresult = ev => { let t = ''; for (const r of ev.results) t += r[0].transcript; texto.value = base + t; };
      rec.onerror = ev => { if (ev.error === 'not-allowed') alert('O navegador não deu acesso ao microfone. Libere nas permissões do site.'); };
      rec.onend = () => { rec = null; bt.classList.remove('ouvindo'); bt.title = 'Ditar (fala para texto)'; texto.focus(); };
      rec.start(); bt.classList.add('ouvindo'); bt.title = 'Ouvindo… clique para parar';
    });
  })();
  form.addEventListener('submit', e => {
    e.preventDefault(); if (conv.ocupado) return;
    const t = texto.value.trim(); if (!t) return; texto.value = '';
    enviar(t);
  });
  document.getElementById('c-nova').addEventListener('click', e => {
    e.stopPropagation();
    if (conv.ctrl) { conv.ctrl.abort(); fetch('/api/parar', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Jarvis': '1' }, body: JSON.stringify({ conversa: conv.id }) }).catch(() => {}); }
    conv.id = Math.random().toString(36).slice(2); conv.sessao = null; conv.ref = null; conv.outra = null; saudar();
  });
  setTimeout(saudar, 400);      // espera o primeiro quadro calcular o ascendente
  // o "cérebro": a lista e o padrão vêm do setup (jarvis.config.json → cerebro)
  for (const m of JARVIS.modelos) {
    const li = document.createElement('li'); li.dataset.m = m.nome; li.className = m.nome === JARVIS.padrao ? 'sel' : '';
    li.innerHTML = '<span></span><small></small>'; li.firstChild.textContent = m.nome; li.lastChild.textContent = m.nota || '';
    document.getElementById('modelos').appendChild(li);
  }
  document.getElementById('modelo-nome').textContent = JARVIS.padrao;
  const modelo = document.getElementById('modelo');
  modelo.querySelector('button').addEventListener('click', e => { e.stopPropagation(); modelo.classList.toggle('aberto'); });
  modelo.querySelectorAll('li').forEach(li => li.addEventListener('click', () => {
    modelo.querySelectorAll('li').forEach(x => x.classList.toggle('sel', x === li));
    document.getElementById('modelo-nome').textContent = li.dataset.m; modelo.classList.remove('aberto');
  }));
  addEventListener('click', () => modelo.classList.remove('aberto'));
  texto.addEventListener('keydown', e => e.stopPropagation());

  function desenharEstrela(x, y, tam, brilho, cor) {
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) return;
    if (tam < 0.85) { ctx.globalAlpha = Math.max(0, brilho); ctx.fillStyle = COR_PONTO[cor]; ctx.fillRect(x, y, tam, tam); ctx.globalAlpha = 1; return; }
    const s = tam * 5.6; ctx.globalAlpha = Math.max(0, Math.min(1, brilho)); ctx.drawImage(SP[cor], x - s / 2, y - s / 2, s, s);
    const c = Math.max(0.9, tam * 0.62); ctx.fillStyle = COR_PONTO[cor]; ctx.beginPath(); ctx.arc(x, y, c / 2, 0, 6.2832); ctx.fill();   // ponto nítido no centro
    ctx.globalAlpha = 1;
  }
  window.jarvis = { dados: () => dados, palco: () => palco.getBoundingClientRect(), escala: () => escala, fala, conv, conceitos: () => conceitos, tocar };   // para testes no console
  requestAnimationFrame(quadro);
})();

</script>
